<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run citation agent</title>
  <style>
    body { max-width: 700px; margin: 3rem auto; padding: 0 1rem; font: 16px system-ui; }
    form { display: grid; gap: 1rem; max-width: 28rem; }
    label { display: grid; gap: .35rem; }
    input, button { font: inherit; padding: .5rem; }
    #status { min-height: 1.5em; }
    #status.processing {
      color: #c62828;
      animation: pulse 1.3s ease-in-out infinite;
    }
    #save-status { white-space: pre-line; }
    #progress { padding-left: 1.5rem; }
    button:disabled { opacity: .6; }
    #report-frame { width: 100%; height: 75vh; margin-top: 1rem; border: 0; }
    @keyframes pulse { 50% { opacity: .4; } }
    @media (prefers-reduced-motion: reduce) {
      #status.processing { animation: none; }
    }
  </style>
</head>
<body>
  <h1>Run citation agent</h1>
  <form id="run-form">
    <label>Target bibcode
      <input name="bibcode" required>
    </label>
    <label>Maximum citing papers
      <input name="rows" type="number" min="1" value="10" required>
    </label>
    <button type="submit">Start run</button>
    <button id="stop-button" type="button" hidden>Stop and clear</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="save-button" type="button" disabled>Save report</button>
  <p id="save-status" role="status" aria-live="polite"></p>
  <h2>Progress</h2>
  <ol id="progress" aria-live="polite"></ol>
  <iframe id="report-frame" title="Citation report" hidden></iframe>
  <script>
    const form = document.getElementById("run-form");
    const bibcodeInput = form.elements.bibcode;
    const status = document.getElementById("status");
    const stopButton = document.getElementById("stop-button");
    const saveButton = document.getElementById("save-button");
    const saveStatus = document.getElementById("save-status");
    const progress = document.getElementById("progress");
    const reportFrame = document.getElementById("report-frame");
    const startButton = form.querySelector("button");
    const debugPrefix = "[debug] ";
    let stopRequested = false;
    let receivedProgressCount = 0;

    async function pollStatus() {
      try {
        const response = await fetch("/status", { cache: "no-store" });
        const data = await response.json();
        const messages = data.progress.slice(receivedProgressCount);
        receivedProgressCount = data.progress.length;
        for (const message of messages) {
          if (message.startsWith(debugPrefix)) {
            if (!stopRequested && !data.stopping) {
              console.log(`[citation-agent] ${message.slice(debugPrefix.length)}`);
            }
          } else if (!stopRequested && !data.stopping) {
            const item = document.createElement("li");
            item.textContent = message;
            progress.append(item);
          }
        }

        if (data.running) {
          startButton.disabled = true;
          bibcodeInput.disabled = true;
          stopButton.hidden = false;
          stopButton.disabled = data.stopping;
          status.classList.toggle("processing", !data.stopping);
          status.textContent = data.stopping
            ? "Stopping after the current request..."
            : "Processing...";
          window.setTimeout(pollStatus, 1000);
        } else {
          startButton.disabled = false;
          bibcodeInput.disabled = false;
          stopButton.hidden = true;
          stopButton.disabled = false;
          status.classList.remove("processing");
          if (data.error) {
            console.error(`[citation-agent] Run failed: ${data.error}`);
            status.textContent = `Run failed: ${data.error}`;
          } else if (data.complete) {
            status.textContent = "Run complete.";
            reportFrame.src = "/report";
            reportFrame.hidden = false;
            saveButton.disabled = false;
            console.log("[citation-agent] Report rendered.");
          } else if (data.stopped || stopRequested) {
            status.textContent = "Run stopped and cleared.";
            console.log("[citation-agent] Run stopped and cleared.");
            stopRequested = false;
          } else {
            status.textContent = "No run is active.";
          }
        }
      } catch (error) {
        startButton.disabled = false;
        stopButton.hidden = true;
        status.classList.remove("processing");
        console.error("[citation-agent] Could not check progress:", error);
        status.textContent = `Could not check progress: ${error.message}`;
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const body = new URLSearchParams(new FormData(form));
      startButton.disabled = true;
      bibcodeInput.disabled = true;
      console.log("[citation-agent] Starting run.", {
        bibcode: bibcodeInput.value.trim(),
        rows: form.elements.rows.value,
      });
      stopRequested = false;
      receivedProgressCount = 0;
      status.classList.remove("processing");
      progress.replaceChildren();
      saveButton.disabled = true;
      saveStatus.textContent = "";
      reportFrame.hidden = true;
      reportFrame.src = "about:blank";
      status.textContent = "Starting run...";
      try {
        const response = await fetch("/run", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        status.textContent = data.message;
        console.log("[citation-agent] Run started.");
        pollStatus();
      } catch (error) {
        startButton.disabled = false;
        bibcodeInput.disabled = false;
        stopButton.hidden = true;
        console.error("[citation-agent] Could not start run:", error);
        status.textContent = `Could not start run: ${error.message}`;
      }
    });

    stopButton.addEventListener("click", async () => {
      stopRequested = true;
      stopButton.disabled = true;
      receivedProgressCount = 0;
      progress.replaceChildren();
      saveButton.disabled = true;
      saveStatus.textContent = "";
      reportFrame.hidden = true;
      reportFrame.src = "about:blank";
      status.classList.remove("processing");
      status.textContent = "Stopping after the current request...";
      console.log("[citation-agent] Stop requested; clearing the report and progress.");
      try {
        const response = await fetch("/stop", { method: "POST" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        pollStatus();
      } catch (error) {
        stopButton.disabled = false;
        console.error("[citation-agent] Could not stop run:", error);
        status.textContent = `Could not stop run: ${error.message}`;
      }
    });

    saveButton.addEventListener("click", async () => {
      saveButton.disabled = true;
      saveStatus.textContent = "Saving HTML and JSON reports...";
      try {
        const response = await fetch("/save", { method: "POST" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        saveStatus.textContent =
          `Saved HTML: ${data.html_path}\nSaved JSON: ${data.json_path}`;
        console.log("[citation-agent] Reports saved.", {
          html: data.html_path,
          json: data.json_path,
        });
      } catch (error) {
        console.error("[citation-agent] Could not save report:", error);
        saveStatus.textContent = `Could not save report: ${error.message}`;
      } finally {
        saveButton.disabled = false;
      }
    });

    bibcodeInput.addEventListener("input", () => {
      status.textContent = "";
      status.classList.remove("processing");
      saveButton.disabled = true;
      saveStatus.textContent = "";
      progress.replaceChildren();
      receivedProgressCount = 0;
      reportFrame.hidden = true;
      reportFrame.src = "about:blank";
    });

    pollStatus();
  </script>
</body>
</html>
